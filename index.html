<!DOCTYPE html>
<html lang="pt-BR">
<head>

    <meta property="og:title" content="🛵 Chamar Mototáxi Agora">
    <meta property="og:description" content="Toque aqui para permitir sua localização e agilizar a corrida direto no WhatsApp!">
    <meta property="og:image" content="https://adeiltonsilvadesouza2023-creator.github.io/Localiza-o-/banner.png">
    <meta property="og:url" content="https://adeiltonsilvadesouza2023-creator.github.io/Localiza-o-/">
    <meta property="og:type" content="website">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Chamar Mototáxi</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
            background-color: #f4f4f9;
            color: #333;
        }

        .container {
            max-width: 400px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        h2 {
            color: #075e54;
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            background-color: #25d366;
            color: white;
            border: none;
            padding: 15px 25px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }

        button:active {
            background-color: #128c7e;
        }

        #status {
            margin-top: 15px;
            font-size: 14px;
            color: #666;
        }

        .aviso-desconto-grande {
            background: #fff3cd;
            border: 2px dashed #ffecb5;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            color: #856404;
            font-size: 16px;
            font-weight: bold;
            line-height: 1.4;
        }

        .desconto-box {
            background: #e1f5fe;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-weight: bold;
            color: #0277bd;
        }

    </style>
</head>

<body>

<div class="container">

    <h2>🏍️ Agilizar Corrida</h2>

    <div class="aviso-desconto-grande">
        🎁 ATENÇÃO!<br>
        Na sua 3ª viagem você ganha
        <span style="color: #d9534f; font-size: 20px;">
            40% DE DESCONTO!
        </span>
    </div>

    <div id="painelDesconto" class="desconto-box" style="display:none;">
        🎉 <span id="textoDesconto"></span>
    </div>

    <p>Preencha seus dados para chamar o mototáxi:</p>

    <input
        type="text"
        id="nomeCliente"
        placeholder="Seu Nome"
    >

    <input
        type="text"
        id="ruaCliente"
        placeholder="Sua Rua / Local de Partida"
    >

    <input
        type="text"
        id="telefoneAmigo"
        placeholder="Quem te indicou? (Opcional - Nome ou WhatsApp)"
    >

    <p style="font-size:14px; margin-top:15px;">
        Toque no botão abaixo para permitir o acesso ao GPS
        e enviar sua localização diretamente para o WhatsApp.
    </p>

    <button onclick="pegarLocalizacao()">
        📍 Pedir com Minha Localização
    </button>

    <p id="status"></p>

</div>


<script>

const SUPABASE_URL =
    'https://etaiheynljzhzvpaqusm.supabase.co';

const SUPABASE_KEY =
    'sb_publishable_DkBXJjtKJCBqjy2aNF8kFg_yKMK0hwg';

const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/*
====================================================
VERIFICAR DESCONTO DO CLIENTE
====================================================
*/

async function verificarBeneficios(nome, rua) {

    if (!nome || !rua) {

        return {
            desconto: 0,
            mensagem: "",
            viagens: 0,
            faltam: 3
        };

    }


    const { data: cliente, error } =
        await supabaseClient
            .from('clientes')
            .select('*')
            .eq('nome', nome)
            .eq('rua', rua)
            .maybeSingle();


    if (error) {

        console.error(
            'Erro ao buscar cliente:',
            error
        );

        return {
            desconto: 0,
            mensagem: "",
            erro: error.message
        };

    }


    /*
    ================================================
    CLIENTE NOVO
    ================================================
    */

    if (!cliente) {

        return {

            desconto: 0,

            mensagem:
                "Você ainda não tem 40% de desconto. Faltam 3 viagens para chegar à 3ª viagem e ganhar 40%.",

            viagens: 0,

            faltam: 3

        };

    }


    const viagensFeitas =
        Number(cliente.viagens_feitas || 0);


    /*
    ================================================
    CALCULAR A PRÓXIMA VIAGEM
    ================================================
    */

    const proximaViagem =
        viagensFeitas + 1;


    /*
    ================================================
    A CADA 3 VIAGENS:
    3ª, 6ª, 9ª, 12ª...
    ================================================
    */

    if (proximaViagem % 3 === 0) {

        return {

            desconto: 40,

            mensagem:
                `🎉 ESTA É SUA ${proximaViagem}ª VIAGEM! Você tem direito a 40% de desconto nesta corrida!`,

            viagens: viagensFeitas,

            faltam: 0

        };

    }


    /*
    ================================================
    CALCULAR QUANTAS VIAGENS FALTAM
    ================================================
    */

    const faltam =
        3 - (proximaViagem % 3);


    return {

        desconto: 0,

        mensagem:
            `Você ainda não tem 40% de desconto. Faltam ${faltam} viagem${faltam === 1 ? '' : 'ens'} para ganhar 40% de desconto.`,

        viagens: viagensFeitas,

        faltam: faltam

    };

}


/*
====================================================
REGISTRAR VIAGEM
====================================================
*/

async function registrarViagemNoSupabase(
    nome,
    rua,
    quemIndicou
) {

    if (!nome || !rua) {

        return {
            ok: false,
            erro: "Nome ou rua vazios"
        };

    }


    const {
        data: cliente,
        error: erroBusca
    } = await supabaseClient
        .from('clientes')
        .select('*')
        .eq('nome', nome)
        .eq('rua', rua)
        .maybeSingle();


    if (erroBusca) {

        console.error(erroBusca);

        return {
            ok: false,
            erro: erroBusca.message
        };

    }


    /*
    ================================================
    CLIENTE NOVO
    ================================================
    */

    if (!cliente) {

        /*
        Se foi indicado por alguém,
        procurar o padrinho.
        */

        if (quemIndicou) {

            const {
                data: padrinho
            } = await supabaseClient
                .from('clientes')
                .select('*')
                .eq('nome', quemIndicou)
                .maybeSingle();


            if (padrinho) {

                await supabaseClient
                    .from('clientes')
                    .update({
                        tem_desconto_indicacao: true
                    })
                    .eq('id', padrinho.id);

            }

        }


        /*
        Criar cliente com 1 viagem
        */

        const { error } =
            await supabaseClient
                .from('clientes')
                .insert([{

                    nome: nome,

                    rua: rua,

                    viagens_feitas: 1,

                    tem_desconto_indicacao: false

                }]);


        if (error) {

            return {
                ok: false,
                erro: error.message
            };

        }

    }


    /*
    ================================================
    CLIENTE EXISTENTE
    ================================================
    */

    else {

        const novasViagens =
            Number(cliente.viagens_feitas || 0) + 1;


        /*
        Se tinha desconto de indicação,
        ele é usado nesta viagem.
        */

        let descontoIndicacao =
            cliente.tem_desconto_indicacao
                ? false
                : false;


        const { error } =
            await supabaseClient
                .from('clientes')
                .update({

                    viagens_feitas: novasViagens,

                    tem_desconto_indicacao:
                        descontoIndicacao

                })
                .eq('id', cliente.id);


        if (error) {

            return {
                ok: false,
                erro: error.message
            };

        }

    }


    return {
        ok: true
    };

}


/*
====================================================
PEGAR LOCALIZAÇÃO
====================================================
*/

async function pegarLocalizacao() {

    const statusDiv =
        document.getElementById("status");

    const painelDesconto =
        document.getElementById("painelDesconto");

    const textoDesconto =
        document.getElementById("textoDesconto");


    const nome =
        document
            .getElementById("nomeCliente")
            .value
            .trim();


    const rua =
        document
            .getElementById("ruaCliente")
            .value
            .trim();


    const quemIndicou =
        document
            .getElementById("telefoneAmigo")
            .value
            .trim();


    /*
    ================================================
    VALIDAR DADOS
    ================================================
    */

    if (!nome || !rua) {

        alert(
            "Por favor, preencha seu Nome e sua Rua para continuar!"
        );

        return;

    }


    /*
    ================================================
    VERIFICAR GPS
    ================================================
    */

    if (!navigator.geolocation) {

        statusDiv.innerHTML =
            "Seu navegador não suporta geolocalização.";

        return;

    }


    statusDiv.innerHTML =
        "🔎 Verificando seu desconto...";


    painelDesconto.style.display =
        "none";


    /*
    ================================================
    VERIFICAR BENEFÍCIO
    ================================================
    */

    const beneficio =
        await verificarBeneficios(
            nome,
            rua
        );


    if (beneficio.erro) {

        statusDiv.innerHTML =
            "Erro no banco de dados: " +
            beneficio.erro;

        return;

    }


    /*
    ================================================
    MOSTRAR DESCONTO
    ================================================
    */

    textoDesconto.innerText =
        beneficio.mensagem;

    painelDesconto.style.display =
        "block";


    /*
    ================================================
    PEGAR GPS
    ================================================
    */

    statusDiv.innerHTML =
        "📍 Obtendo sua localização exata...";


    navigator.geolocation.getCurrentPosition(

        async (position) => {

            /*
            ========================================
            COORDENADAS
            ========================================
            */

            const lat =
                position.coords.latitude;

            const lon =
                position.coords.longitude;


            const precisao =
                position.coords.accuracy;


            /*
            ========================================
            LINK CORRETO DO GOOGLE MAPS
            ========================================
            */

            const linkMaps =
                `https://www.google.com/maps?q=${lat},${lon}`;


            /*
            ========================================
            NÚMERO DO WHATSAPP
            ========================================
            */

            const seuNumeroWhatsApp =
                "5581985269588";


            /*
            ========================================
            REGISTRAR VIAGEM
            ========================================
            */

            statusDiv.innerHTML =
                "📋 Registrando sua viagem...";


            const registro =
                await registrarViagemNoSupabase(
                    nome,
                    rua,
                    quemIndicou
                );


            if (!registro.ok) {

                statusDiv.innerHTML =
                    "Erro ao registrar viagem: " +
                    registro.erro;

                return;

            }


            /*
            ========================================
            MONTAR MENSAGEM
            ========================================
            */

            let textoMensagem =

                `🏍️ NOVA CORRIDA

Nome: ${nome}

Rua informada: ${rua}

📍 LOCALIZAÇÃO DO GPS:
${linkMaps}

Precisão aproximada do GPS:
${Math.round(precisao)} metros`;


            /*
            ========================================
            AVISO DO DESCONTO
            ========================================
            */

            if (beneficio.desconto === 40) {

                textoMensagem +=

                    `

🎉 DESCONTO:
CLIENTE TEM DIREITO A 40% DE DESCONTO NESTA VIAGEM.

${beneficio.mensagem}`;

            }

            else {

                textoMensagem +=

                    `

🎁 PROGRAMA DE DESCONTO:
${beneficio.mensagem}`;

            }


            /*
            ========================================
            ENVIAR PARA WHATSAPP
            ========================================
            */

            const mensagem =
                encodeURIComponent(
                    textoMensagem
                );


            statusDiv.innerHTML =
                "✅ Tudo pronto! Abrindo o WhatsApp...";


            /*
            ========================================
            LINK CORRETO DO WHATSAPP
            ========================================
            */

            window.location.href =
                `https://wa.me/${seuNumeroWhatsApp}?text=${mensagem}`;

        },


        /*
        ============================================
        ERRO DO GPS
        ============================================
        */

        (error) => {

            let msg =
                "❌ Não foi possível obter sua localização. ";


            if (error.code === 1) {

                msg +=
                    "Você negou a permissão do GPS. Permita a localização e tente novamente.";

            }

            else if (error.code === 2) {

                msg +=
                    "A posição está indisponível. Verifique se o GPS está ativado.";

            }

            else if (error.code === 3) {

                msg +=
                    "O GPS demorou muito para responder. Tente novamente em um local com melhor sinal.";

            }

            else {

                msg +=
                    "Verifique as permissões de localização do navegador.";

            }


            statusDiv.innerHTML =
                msg;

        },


        /*
        ============================================
        CONFIGURAÇÃO DO GPS
        ============================================
        */

        {
            enableHighAccuracy: true,

            timeout: 30000,

            maximumAge: 0
        }

    );

}

</script>

</body>
</html>
